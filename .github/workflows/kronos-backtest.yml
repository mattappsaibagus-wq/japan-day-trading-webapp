# Walk-forward check of Kronos next-hour forecasts on the last 15 sessions of
# 15m bars (kronos_backtest.py). Manual, or on pull requests that change it.
name: Kronos backtest

on:
  workflow_dispatch:
  pull_request:
    paths:
      - kronos_backtest.py
      - .github/workflows/kronos-backtest.yml

env:
  KRONOS_REPO: https://github.com/shiyu-coder/Kronos
  KRONOS_COMMIT: 67b630e67f6a18c9e9be918d9b4337c960db1e9a
  KRONOS_DIR: Kronos

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-kronos.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-kronos.txt

      - name: Get Kronos (pinned commit)
        run: |
          git init -q "$KRONOS_DIR"
          git -C "$KRONOS_DIR" fetch -q --depth 1 "$KRONOS_REPO" "$KRONOS_COMMIT"
          git -C "$KRONOS_DIR" checkout -q FETCH_HEAD

      - name: Cache Kronos weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kronos-hf-${{ env.KRONOS_COMMIT }}
          restore-keys: kronos-hf-

      - name: Backtest
        run: python -u kronos_backtest.py kronos_backtest.json --days 15 --paths 4

      - uses: actions/upload-artifact@v4
        with:
          name: kronos-backtest
          path: kronos_backtest.json
